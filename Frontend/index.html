<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js Library for progress visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
</head>
<body>

<!-- Login Container -->
<div id="loginContainer" class="container" style="display: none;">
  <h2 class="app-title">🔐 Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn" onclick="login()" style="width: 100%; padding: 13px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px;">Login</button>
  <p class="helper-text">Create your email and password</p>
</div>

<!-- Task Manager Container -->
<div id="taskContainer" class="container" style="display: block;">
 <h2 class="app-title">🗂️ Task Manager</h2>

  <input id="title" placeholder="Title">
  <input id="description" placeholder="Description">

  <select id="status">
    <option>Pending</option>
    <option>In Progress</option>
    <option>Completed</option>
  </select>

  <button id="addBtn" onclick="addOrUpdateTask()">Add Task</button>
  <button class="logout-btn" onclick="logout()">Logout</button>
  
  <div class="analytics" style="display: flex !important; justify-content: space-between; gap: 12px; margin: 20px 0;">
    <div style="flex: 1; background: #eef2ff; padding: 12px; border-radius: 12px; text-align: center;">
      <h3 id="totalCount" style="font-size: 22px; color: #4f46e5;">0</h3>
      <p style="font-size: 12px; color: #475569;">Total</p>
    </div>
    <div style="flex: 1; background: #eef2ff; padding: 12px; border-radius: 12px; text-align: center;">
      <h3 id="completedCount" style="font-size: 22px; color: #4f46e5;">0</h3>
      <p style="font-size: 12px; color: #475569;">Completed</p>
    </div>
    <div style="flex: 1; background: #eef2ff; padding: 12px; border-radius: 12px; text-align: center;">
      <h3 id="pendingCount" style="font-size: 22px; color: #4f46e5;">0</h3>
      <p style="font-size: 12px; color: #475569;">Pending</p>
    </div>
  </div>

  <div class="progress-section" style="background: linear-gradient(135deg, #eef2ff, #f0f9ff); padding: 16px; border-radius: 14px; margin: 20px 0; border: 1px solid #e0e7ff; display: block !important;">
    <h3 style="font-size: 16px; color: #1e293b; margin-bottom: 12px; font-weight: 600;">Progress Overview</h3>
    <div class="progress-container" style="width: 100%; height: 280px; margin-bottom: 16px;">
      <canvas id="progressChart"></canvas>
    </div>
    <div class="progress-stats" style="display: flex; flex-direction: column; gap: 10px;">
      <div class="stat-item" style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 14px; border-radius: 10px; border: 1px solid #e5e7eb;">
        <span class="stat-label" style="font-size: 13px; color: #4b5563; font-weight: 500;">Completion Rate:</span>
        <span class="stat-value" id="completionRate" style="font-size: 16px; color: #4f46e5; font-weight: 700;">0%</span>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
    <button class="filter-btn" onclick="setFilter('Pending', this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('In Progress', this)">In Progress</button>
    <button class="filter-btn" onclick="setFilter('Completed', this)">Completed</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
<script>
  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if (!email || !password) {
      alert("Please enter email and password");
      return;
    }
    localStorage.setItem("loggedIn", "true");
    checkAuth();
  }
  
  window.addEventListener("DOMContentLoaded", function() {
    checkAuth();
    fetchTasks();
  });
</script>
</body>
</html>
