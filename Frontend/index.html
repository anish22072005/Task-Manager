<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
 <h2 class="app-title">🗂️ Task Manager</h2>


  <input id="title" placeholder="Title">
  <input id="description" placeholder="Description">

  <select id="status">
    <option>Pending</option>
    <option>In Progress</option>
    <option>Completed</option>
  </select>

  <button id="addBtn" onclick="addOrUpdateTask()">Add Task</button>
  <div class="analytics">
    <div>
      <h3 id="totalCount">0</h3>
      <p>Total</p>
    </div>
    <div>
      <h3 id="completedCount">0</h3>
      <p>Completed</p>
      </div>
      <div>
        <h3 id="pendingCount">0</h3>
        <p>Pending</p>
      </div>
    </div>
    <div id="toast"></div>
  </div>
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
  <button class="filter-btn" onclick="setFilter('Pending', this)">Pending</button>
  <button class="filter-btn" onclick="setFilter('In Progress', this)">In Progress</button>
  <button class="filter-btn" onclick="setFilter('Completed', this)">Completed</button>
</div>

<ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
